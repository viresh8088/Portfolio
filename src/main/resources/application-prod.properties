# Production profile
# Required environment variables: DB_URL, DB_USERNAME, DB_PASSWORD,
# MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD,
# CONTACT_RECIPIENT, and CONTACT_FROM.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.contact.email-enabled=${CONTACT_EMAIL_ENABLED:true}
app.contact.recipient=${CONTACT_RECIPIENT}
app.contact.from=${CONTACT_FROM}
app.contact.duplicate-window-minutes=${CONTACT_DUPLICATE_WINDOW_MINUTES:5}
